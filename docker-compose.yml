# Reproducible runs of the classification engine.
#
#   docker compose build
#   docker compose run --rm ecf help
#   docker compose run --rm ecf classify
#   docker compose run --rm ecf preview
#   docker compose run --rm -e ECF_DATASET=2023_24 ecf dashboard
#
# The workbooks are NOT in the image. They are bind-mounted from this folder,
# so the container reads and writes the same files you see in Explorer.
#
# Close the workbooks in Excel before running anything that writes. Excel holds
# an exclusive lock and the container cannot save past it.

services:
  ecf:
    build: .
    image: ecf-discretionary-fr:latest
    environment:
      ECF_DATASET: "${ECF_DATASET:-2025}"
    volumes:
      # Data the engines read and write. Mounted individually rather than
      # mounting the whole repo, so a stray container cannot touch source or
      # the .venv.
      - "./Data Sheets:/work/Data Sheets"
      - "./Taxonomy:/work/Taxonomy"
      - "./Final Review:/work/Final Review"
